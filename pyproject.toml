[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "longquan"
version = "0.1.0"
description = "A closed-book agent that learns game rules from frames."
requires-python = ">=3.11"
license = { text = "MIT-0" }
dependencies = ["numpy"]

[tool.setuptools.packages.find]
include = ["longquan*"]
